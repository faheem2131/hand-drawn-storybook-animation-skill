<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Little Paper Boat · 小纸船</title>
<style>
  html,body{margin:0;height:100%;background:#1b1a20;overflow:hidden;font-family:Georgia,serif}
  #c{position:absolute;inset:0;margin:auto;width:100%;max-width:calc(100vh*16/9);aspect-ratio:16/9;max-height:100%;display:block;top:50%;transform:translateY(-50%)}
  #ui{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:10px;justify-content:center}
  #ui button{font:15px Georgia,serif;padding:8px 16px;border-radius:20px;border:1px solid #2a2420;background:#f3ecdc;color:#2a2420;cursor:pointer;opacity:.9}
  body.capture #ui{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="play">▶ Play · 播放</button><button id="replay">↺ Replay · 重播</button></div>
<!-- optional soundtrack next to the page (generated by soundtrack.py) -->
<audio id="music" src="soundtrack.m4a" preload="auto"></audio>
<script>
"use strict";
// ============================================================================
// The Little Paper Boat · 小纸船 — a 30-second self-drawing watercolor story.
// Everything is drawn procedurally from story time t (seconds), so any frame
// can be reproduced exactly: window.renderAt(t).
// ============================================================================
const W = 1280, H = 720, DURATION = 30;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

// ---------------------------------------------------------------- utilities
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeIn = t => t * t * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const shade = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const INK = [42, 36, 32];
const PAPER = [243, 236, 220];

function sprite(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }

// irregular watercolor blob outline
function blobPath(g, cx, cy, rx, ry, rand, jit) {
  const n = 36, p1 = rand() * TAU, p2 = rand() * TAU, k = 2 + Math.floor(rand() * 3);
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const r = 1 + Math.sin(a * k + p1) * jit * .6 + Math.sin(a * (k + 3) + p2) * jit * .3 + (rand() - .5) * jit * .4;
    const x = cx + Math.cos(a) * rx * r, y = cy + Math.sin(a) * ry * r;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}
// layered watercolor wash: several deformed low-alpha polygons + darker pooled edge
function wash(g, cx, cy, rx, ry, col, rand, o = {}) {
  const L = o.layers ?? 6, A = o.alpha ?? .14, jit = o.jit ?? .14, sh = o.shrink ?? .05;
  for (let l = 0; l < L; l++) {
    const s = 1 - l * sh;
    blobPath(g, cx + (rand() - .5) * rx * .08, cy + (rand() - .5) * ry * .08, rx * s, ry * s, rand, jit);
    g.fillStyle = rgb(col, A); g.fill();
    if (l === 0 && o.edge !== false) { g.lineWidth = o.edgeW ?? 2; g.strokeStyle = rgb(shade(col, .78), Math.min(1, A * 1.4)); g.stroke(); }
  }
}
// pigment granulation dots inside current clip
function granulate(g, x, y, w, h, col, n, rand, a = .2) {
  for (let i = 0; i < n; i++) { g.fillStyle = rgb(col, a * rand()); g.fillRect(x + rand() * w, y + rand() * h, 1 + rand() * 1.6, 1 + rand() * 1.6); }
}
// resample a polyline and push it around with smooth noise: hand-drawn wobble
function wobble(pts, step, amp, seed) {
  const out = []; let d = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(len / step));
    const nx = -(y1 - y0) / (len || 1), ny = (x1 - x0) / (len || 1);
    for (let j = 0; j < n; j++) {
      const u = j / n, dd = d + len * u;
      const off = (Math.sin(dd * .045 + seed) * .6 + Math.sin(dd * .13 + seed * 2.3) * .4) * amp;
      out.push([lerp(x0, x1, u) + nx * off, lerp(y0, y1, u) + ny * off]);
    }
    d += len;
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}
// variable-width ink line, revealed up to fraction p (the "self-drawing" pen)
function ink(g, pts, o = {}) {
  const w = o.w ?? 2.2, col = o.col ?? INK, p = o.p ?? 1, seed = o.seed ?? 1, a = o.a ?? 1;
  const n = pts.length; if (n < 2 || p <= 0) return;
  const m = Math.min(n - 1, Math.max(1, Math.floor((n - 1) * p)));
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = rgb(col, a);
  for (let i = 0; i < m; i++) {
    const u = i / (n - 1);
    const taper = o.taper === false ? 1 : Math.min(1, u * 8, (1 - u) * 8) * .65 + .35;
    g.lineWidth = w * taper * (.7 + .6 * hash(seed + i * .37));
    g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(pts[i + 1][0], pts[i + 1][1]); g.stroke();
  }
}
function ellipsePts(cx, cy, rx, ry, n = 40, a0 = 0, a1 = TAU) { const o = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return o; }

// ------------------------------------------------------------ story timing
// boat speed profile (px/s) integrated once → reproducible position for any t
const BX0 = 700, WATER = 470, HORIZON = 400;
function boatSpeed(t) {
  if (t < 6.4) return 0;
  if (t < 7.6) return 100 * ss(6.4, 7.6, t);
  if (t < 13) return 100;
  if (t < 17) return lerp(100, 150, ss(13, 17, t));
  if (t < 18) return lerp(150, 190, ss(17, 18, t));
  if (t < 22.6) return 190;
  return 190 * (1 - ss(22.6, 25.2, t));
}
const BX_TAB = (() => { const a = new Float32Array(30001); let x = BX0; for (let i = 0; i <= 30000; i++) { a[i] = x; x += boatSpeed(i / 1000) / 1000; } return a; })();
const bx = t => BX_TAB[clamp(Math.round(t * 1000), 0, 30000)];
const CX = bx(25.2) + 72;              // where the child stands on the shore
const STARS_T0 = 17.4, STAR_N = 9;     // falling stars: impact times STARS_T0 + i*0.5
const FALL = Array.from({ length: STAR_N }, (_, i) => {
  const ti = STARS_T0 + i * .5;
  const x = lerp(bx(STARS_T0) + 330, CX - 150, i / (STAR_N - 1));
  return { ti, x, x0: x - 70 - hash(i + 4) * 60, y0: 150 + hash(i + 9) * 110 };
});

// camera: x follows the boat; [t, y, zoom] keyframes eased per segment
const CAMK = [
  [0, 360, 1.0], [4.6, 360, 1.0], [6.2, 405, 1.34], [8.2, 405, 1.3], [10.8, 372, 1.05],
  [13.0, 362, 1.0], [16.0, 330, .8], [18.2, 320, .88], [22.0, 345, .96], [25.0, 392, 1.14],
  [26.4, 402, 1.26], [28.6, 418, 1.75], [30, 422, 1.86]
];
function camera(t) {
  let i = 0; while (i < CAMK.length - 2 && t > CAMK[i + 1][0]) i++;
  const [t0, y0, z0] = CAMK[i], [t1, y1, z1] = CAMK[i + 1];
  const u = easeIO(clamp((t - t0) / (t1 - t0)));
  const follow = bx(Math.max(0, t - .35)) + 170;
  let x = lerp(640, follow, ss(6.6, 9.6, t));
  x = lerp(x, CX - 34, ss(23.4, 26.4, t));
  return { x, y: lerp(y0, y1, u), z: lerp(z0, z1, u) };
}
const night = t => ss(9.8, 15.5, t);

// ---------------------------------------------------------- pre-rendered art
const R = rng(2024);
const SKY = [
  { stops: [[0, [64, 168, 246]], [.42, [150, 170, 255]], [.72, [255, 150, 200]], [1, [255, 214, 110]]], blot: [255, 250, 240] },
  { stops: [[0, [44, 36, 150]], [.5, [78, 60, 196]], [1, [150, 96, 220]]], blot: [170, 140, 255] }
].map((p, k) => sprite(1500, 820, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  p.stops.forEach(([o, c]) => gr.addColorStop(o, rgb(c)));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const r = rng(11 + k);
  for (let i = 0; i < 60; i++) wash(g, r() * w, r() * h, 120 + r() * 260, 30 + r() * 70, p.blot, r, { layers: 3, alpha: .05, edge: false, jit: .3 });
  for (let i = 0; i < 25; i++) wash(g, r() * w, r() * h, 100 + r() * 200, 30 + r() * 60, shade(p.stops[1][1], .85), r, { layers: 3, alpha: .05, edge: false, jit: .3 });
}));
const SEA = [
  [[70, 214, 226], [28, 170, 222], [14, 116, 206]],
  [[70, 76, 200], [44, 54, 170], [30, 34, 132]]
].map((p, k) => sprite(1500, 820, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, rgb(p[0])); gr.addColorStop(.35, rgb(p[1])); gr.addColorStop(1, rgb(p[2]));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const r = rng(31 + k);
  for (let i = 0; i < 70; i++) wash(g, r() * w, 20 + r() * h, 150 + r() * 260, 8 + r() * 26, shade(p[1], 1.12), r, { layers: 3, alpha: .07, edge: false, jit: .2 });
  for (let i = 0; i < 40; i++) wash(g, r() * w, 20 + r() * h, 120 + r() * 200, 6 + r() * 18, shade(p[2], .9), r, { layers: 3, alpha: .07, edge: false, jit: .2 });
  g.save(); g.beginPath(); g.rect(0, 0, w, h); g.clip(); granulate(g, 0, 0, w, h, shade(p[2], .7), 9000, r, .12); g.restore();
}));
// far islands (parallax .35): day + night versions of identical shapes
const ISLANDS = [[-260, 230, 46], [260, 340, 70], [760, 200, 38], [1160, 300, 58], [1560, 240, 44], [1950, 320, 64]];
const ISL = [[[96, 200, 120], [52, 160, 104]], [[86, 70, 186], [64, 50, 160]]].map((pal, k) => ISLANDS.map(([, w, h], i) => sprite(w + 60, h + 30, (g, sw, sh) => {
  const r = rng(70 + i), base = sh - 6;
  const pts = []; const n = 22;
  for (let j = 0; j <= n; j++) { const u = j / n; const bump = Math.pow(Math.sin(u * Math.PI), .8) * (1 - .25 * Math.sin(u * 9 + i)) ; pts.push([30 + u * w, base - bump * h + (r() - .5) * 4]); }
  g.beginPath(); g.moveTo(30, base); pts.forEach(p => g.lineTo(p[0], p[1])); g.lineTo(30 + w, base); g.closePath();
  g.fillStyle = rgb(pal[0], .85); g.fill();
  g.save(); g.clip();
  const r2 = rng(90 + i);
  for (let j = 0; j < 5; j++) wash(g, 30 + r2() * w, base - r2() * h * .6, 30 + r2() * 60, 10 + r2() * 20, pal[1], r2, { layers: 3, alpha: .16, edge: false });
  granulate(g, 0, 0, sw, sh, shade(pal[1], .7), 600, r2, .25);
  g.restore();
  ink(g, wobble(pts, 6, 1.2, i * 3), { w: 1.6, a: k ? .55 : .7, seed: i });
  // little ink trees on the ridge
  for (let j = 0; j < 3 + i % 3; j++) {
    const p = pts[3 + Math.floor(r() * (n - 6))]; const th = 8 + r() * 10;
    g.fillStyle = rgb(pal[1], .9); g.beginPath(); g.moveTo(p[0] - 4, p[1] + 2); g.lineTo(p[0], p[1] - th); g.lineTo(p[0] + 4, p[1] + 2); g.fill();
  }
})));
// clouds (parallax .12)
const CLOUDS = [[60, 120, 260], [520, 70, 320], [980, 150, 240], [1380, 90, 300], [1800, 140, 260], [2200, 80, 280]];
const CLD = [[255, 242, 250], [150, 120, 230]].map((col, k) => CLOUDS.map(([, , w], i) => sprite(w + 80, 110, (g) => {
  const r = rng(140 + i);
  for (let j = 0; j < 5; j++) wash(g, 40 + w * (.2 + .6 * r()), 55 + (r() - .5) * 20, w * (.18 + r() * .18), 16 + r() * 12, col, r, { layers: 5, alpha: k ? .2 : .22, edgeW: 1.2 });
  const pts = []; for (let j = 0; j <= 30; j++) { const u = j / 30; pts.push([40 + u * w, 62 - Math.abs(Math.sin(u * Math.PI * 3)) * 16 * Math.sin(u * Math.PI)]); }
  ink(g, wobble(pts, 5, .8, i), { w: 1.2, a: k ? .35 : .5, seed: i * 7 });
})));
// gold bloom that the stars leave on the water
const BLOOM = sprite(220, 70, (g) => { const r = rng(300); wash(g, 110, 35, 64, 16, [255, 196, 40], r, { layers: 8, alpha: .22, edgeW: 1.6 }); wash(g, 110, 35, 34, 9, [255, 244, 170], r, { layers: 5, alpha: .3, edge: false }); });
// paper grain (soft-light overlay)
const GRAIN = sprite(W, H, (g, w, h) => {
  const im = g.createImageData(w, h), d = im.data, r = rng(7);
  for (let i = 0; i < w * h; i++) { const x = i % w, y = (i / w) | 0; const v = 128 + (r() - .5) * 34 + Math.sin(x * .011 + Math.sin(y * .007) * 3) * 6 + Math.sin(y * .02 + x * .003) * 4; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0);
  g.strokeStyle = 'rgba(90,80,70,.12)'; g.lineWidth = .6;
  for (let i = 0; i < 500; i++) { const x = r() * w, y = r() * h, a = r() * TAU, l = 4 + r() * 14; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 1) * l * .5, y + Math.sin(a + 1) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
});
// shore: sand hill, grass, a small house and a tree (night palette — we only arrive at night)
// sprite coords: (OX, BASE) ↔ world (CX - 20, WATER + 2); the beach edge slopes toward the viewer
const SHORE_W = 1700, SHORE_H = 720, OX = 420, BASE = 360, EDGE_DX = 400, EDGE_P = 1.35;
const hillY = sx => { const u = clamp((sx - OX) / (SHORE_W - OX)); return BASE + 8 - Math.pow(ss(0, .32, u), 1.1) * 150 - Math.sin(u * 7) * 5; };
const HOUSE = [OX + 400, 0], TREE = [OX + 230, 0];
HOUSE[1] = hillY(HOUSE[0]) + 4; TREE[1] = hillY(TREE[0]) + 4;
const SHORE = sprite(SHORE_W, SHORE_H, (g, w, h) => {
  const r = rng(500), base = BASE;
  const top = []; for (let sx = OX; sx <= w; sx += 30) top.push([sx, hillY(sx)]);
  const edge = []; for (let j = 0; j <= 16; j++) { const u = j / 16; edge.push([OX - EDGE_DX * Math.pow(u, EDGE_P) + Math.sin(u * 9) * 5, base + 8 + u * (h - base - 8)]); }
  g.beginPath(); edge.slice().reverse().forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); top.forEach(p => g.lineTo(p[0], p[1])); g.lineTo(w, h); g.closePath();
  const gr = g.createLinearGradient(0, base - 160, 0, h); gr.addColorStop(0, rgb([70, 190, 96])); gr.addColorStop(.24, rgb([86, 196, 104])); gr.addColorStop(.34, rgb([246, 196, 120])); gr.addColorStop(1, rgb([236, 168, 110]));
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  for (let j = 0; j < 22; j++) wash(g, r() * w, base - 20 + r() * (h - base + 20), 80 + r() * 160, 20 + r() * 40, [255, 220, 150], r, { layers: 3, alpha: .14, edge: false });
  // wet sand band along the water's edge
  g.lineCap = 'round'; for (let j = 0; j < 3; j++) { g.strokeStyle = rgb([200, 130, 90], .2); g.lineWidth = 26 - j * 7; g.beginPath(); edge.forEach((p, i) => i ? g.lineTo(p[0] + 12, p[1]) : g.moveTo(p[0] + 12, p[1])); g.stroke(); }
  for (let j = 0; j < 12; j++) wash(g, OX + 200 + r() * w, base - 150 + r() * 90, 80 + r() * 140, 14 + r() * 20, [40, 160, 80], r, { layers: 3, alpha: .2, edge: false });
  granulate(g, 0, 0, w, h, [140, 90, 60], 7000, r, .18);
  g.restore();
  ink(g, wobble(top, 6, 1.4, 5), { w: 2.2, seed: 40 });
  ink(g, wobble(edge, 6, 1.2, 6), { w: 1.8, seed: 41, a: .8 });
  ink(g, wobble(edge.map(([x, y]) => [x - 10, y + 6]), 6, 2, 12), { w: 1.4, col: [228, 232, 244], a: .6, seed: 57 }); // foam
  // grass tufts
  for (let j = 0; j < 50; j++) {
    const x = OX + 60 + r() * (w - OX - 80), y = hillY(x) + 2;
    for (let k = -1; k <= 1; k++) ink(g, wobble([[x + k * 3, y], [x + k * 6 + (r() - .5) * 4, y - 8 - r() * 9]], 3, .5, j + k), { w: 1.1, a: .8, seed: j, taper: false });
  }
  // house on the hill
  const [hx, hy] = HOUSE;
  g.fillStyle = rgb([255, 226, 150]); g.fillRect(hx - 52, hy - 62, 104, 62);
  g.save(); g.beginPath(); g.rect(hx - 52, hy - 62, 104, 62); g.clip(); for (let j = 0; j < 4; j++) wash(g, hx + (r() - .5) * 80, hy - 30, 50, 30, [255, 180, 110], r, { layers: 2, alpha: .18, edge: false }); g.restore();
  g.beginPath(); g.moveTo(hx - 66, hy - 58); g.lineTo(hx, hy - 112); g.lineTo(hx + 66, hy - 58); g.closePath(); g.fillStyle = rgb([236, 64, 70]); g.fill();
  g.fillStyle = rgb([170, 90, 200]); g.fillRect(hx + 26, hy - 112, 14, 30);
  ink(g, wobble([[hx - 52, hy], [hx - 52, hy - 60], [hx + 52, hy - 60], [hx + 52, hy]], 5, .9, 3), { w: 2, seed: 50 });
  ink(g, wobble([[hx - 68, hy - 56], [hx, hy - 113], [hx + 68, hy - 56]], 5, .9, 4), { w: 2.2, seed: 51 });
  ink(g, wobble([[hx + 26, hy - 92], [hx + 26, hy - 112], [hx + 40, hy - 112], [hx + 40, hy - 80]], 4, .6, 6), { w: 1.6, seed: 52 });
  ink(g, wobble([[hx - 14, hy], [hx - 14, hy - 32], [hx + 6, hy - 32], [hx + 6, hy]], 4, .6, 7), { w: 1.6, seed: 53 });  // door
  g.fillStyle = rgb([90, 60, 120]); g.fillRect(hx + 18, hy - 44, 22, 20);                                             // window (lit at runtime)
  ink(g, wobble([[hx + 18, hy - 44], [hx + 40, hy - 44], [hx + 40, hy - 24], [hx + 18, hy - 24], [hx + 18, hy - 44]], 4, .5, 8), { w: 1.5, seed: 54 });
  // a round tree
  const [tx, ty] = TREE;
  ink(g, wobble([[tx, ty + 2], [tx + 2, ty - 50]], 4, .8, 9), { w: 3, seed: 55 });
  wash(g, tx, ty - 74, 46, 40, [60, 200, 90], r, { layers: 6, alpha: .3 });
  ink(g, wobble(ellipsePts(tx, ty - 74, 44, 38, 30), 6, 2.2, 10), { w: 1.8, seed: 56 });
});
const SHORE_X0 = CX - 20 - OX;                 // world x of sprite x=0
const SHORE_Y0 = WATER + 2 - BASE;             // world y of sprite y=0
const WIN = [SHORE_X0 + HOUSE[0] + 29, SHORE_Y0 + HOUSE[1] - 34];
const shoreEdgeX = wy => CX - 20 - EDGE_DX * Math.pow(clamp((wy - WATER - 6) / (SHORE_H - BASE - 8)), EDGE_P);

// --------------------------------------------------------------- drawing
let cam = camera(0), hy = 0;
function layer(par) {
  const zl = 1 + (cam.z - 1) * par;
  ctx.setTransform(zl, 0, 0, zl, W / 2 - cam.x * par * zl, hy - HORIZON * zl);
  return zl;
}
const screen = () => ctx.setTransform(1, 0, 0, 1, 0, 0);

// soft wobbly reveal clip: everything left of the moving wet edge is shown
function revealClip(p, top, bottom) {
  const x = lerp(-160, W + 160, p);
  ctx.beginPath(); ctx.moveTo(-10, top);
  for (let y = top; y <= bottom; y += 20) ctx.lineTo(x + Math.sin(y * .021) * 50 + Math.sin(y * .067 + 1) * 18, y);
  ctx.lineTo(-10, bottom); ctx.closePath(); ctx.clip();
}

function drawStar4(g, x, y, r, col, a) {
  g.fillStyle = rgb(col, a); g.beginPath();
  for (let i = 0; i < 8; i++) { const ang = i / 8 * TAU - Math.PI / 2, rr = i % 2 ? r * .28 : r; g.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  g.closePath(); g.fill();
}

// paper boat: 7 vertices morph from a flat sheet (m=0) to a folded boat (m=1)
const SHEET = [[-34, -34], [-11, -34], [11, -34], [34, -34], [34, 34], [0, 34], [-34, 34]];
const BOAT = [[-38, 0], [-15, 0], [0, -32], [15, 0], [38, 0], [25, 14], [-25, 14]];
function drawBoat(g, x, y, rot, m, t, glow = 0, flutter = 0) {
  g.save(); g.translate(x, y); g.rotate(rot);
  const P = BOAT.map((b, i) => { const s = SHEET[i]; const fl = Math.sin(t * 7 + i) * flutter * 5; return [lerp(s[0], b[0], m), lerp(s[1], b[1], m) + fl]; });
  const paper = mix([248, 244, 232], [255, 236, 190], glow);
  g.beginPath(); P.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
  g.fillStyle = rgb(paper); g.fill();
  const M = [(P[1][0] + P[3][0]) / 2, (P[1][1] + P[3][1]) / 2];
  g.fillStyle = rgb([90, 170, 255], .4 * m); g.beginPath(); g.moveTo(...P[2]); g.lineTo(...P[3]); g.lineTo(...M); g.fill();
  const a1 = [lerp(P[0][0], P[6][0], .45), lerp(P[0][1], P[6][1], .45)], a2 = [lerp(P[4][0], P[5][0], .45), lerp(P[4][1], P[5][1], .45)];
  g.fillStyle = rgb([255, 120, 170], .35 * m); g.beginPath(); g.moveTo(...a1); g.lineTo(...a2); g.lineTo(...P[5]); g.lineTo(...P[6]); g.fill();
  const seed = Math.floor(t * 8);   // boiling line: redraw the wobble 8× per second
  ink(g, wobble([...P, P[0]], 4, .7, seed), { w: 1.9, seed: seed + 1, taper: false });
  if (m > .3) {
    ink(g, wobble([P[1], P[3]], 4, .5, seed + 2), { w: 1.3, a: m, seed, taper: false });
    ink(g, wobble([P[2], M], 4, .5, seed + 3), { w: 1.1, a: m * .7, seed, taper: false });
  } else {
    ink(g, wobble([[-34 * (1 - m), 0], [34 * (1 - m), 0]], 4, .5, seed + 4), { w: 1, a: .4 * (1 - m), seed, taper: false });
  }
  g.restore();
}

// the child on the shore, facing left (toward the arriving boat)
function drawChild(t, boatPos) {
  const x = CX, y = WATER - 2;
  const bend = ss(25.0, 25.9, t) * (1 - ss(26.6, 27.4, t));      // lean toward the boat, then straighten
  const lift = ss(26.4, 27.4, t);                                 // boat travels up into the arms
  const happy = ss(27.2, 27.8, t);
  const seed = Math.floor(t * 8);
  const g = ctx;
  // legs
  ink(g, wobble([[x - 5, y - 46], [x - 7, y - 3]], 4, .6, seed), { w: 3.2, seed, taper: false });
  ink(g, wobble([[x + 6, y - 46], [x + 7, y - 3]], 4, .6, seed + 1), { w: 3.2, seed, taper: false });
  g.fillStyle = rgb([50, 44, 48]); g.beginPath(); g.ellipse(x - 10, y - 2, 7, 3.5, 0, 0, TAU); g.ellipse(x + 4, y - 2, 7, 3.5, 0, 0, TAU); g.fill();
  // upper body pivots at the hip
  const hip = [x, y - 44];
  g.save(); g.translate(hip[0], hip[1]); g.rotate(-.75 * bend);
  // coat (warm — the light in this world belongs to the people waiting)
  const coat = [[-13, -42], [12, -42], [21, 12], [-22, 12]];
  g.beginPath(); coat.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
  g.fillStyle = rgb([255, 72, 64]); g.fill();
  g.save(); g.clip(); const r = rng(9); wash(g, 6, -10, 18, 26, [220, 40, 60], r, { layers: 3, alpha: .25, edge: false }); g.restore();
  ink(g, wobble([...coat, coat[0]], 4, .7, seed + 2), { w: 2, seed: seed + 3, taper: false });
  // scarf
  g.fillStyle = rgb([255, 214, 40]); g.fillRect(-14, -46, 28, 8);
  ink(g, wobble([[10, -40], [16, -22]], 3, .6, seed + 5), { w: 4, col: [255, 200, 30], seed, taper: false });
  // head
  const hc = [-2, -62];
  g.fillStyle = rgb([244, 214, 188]); g.beginPath(); g.arc(hc[0], hc[1], 16, 0, TAU); g.fill();
  // hair: a bob over the top and back of the head, fringe stops above the eye (she faces left)
  g.fillStyle = rgb([58, 40, 36]); g.beginPath();
  g.moveTo(hc[0] - 17, hc[1] - 1); g.arc(hc[0], hc[1], 17.5, Math.PI * 1.03, Math.PI * 2.02);
  [[17, 11], [9, 13], [5, -1], [-3, -7], [-11, -5]].forEach(([dx, dy]) => g.lineTo(hc[0] + dx, hc[1] + dy));
  g.closePath(); g.fill();
  ink(g, wobble(ellipsePts(hc[0], hc[1], 16, 16, 28), 3, .6, seed + 6), { w: 1.8, seed: seed + 7, taper: false });
  g.fillStyle = rgb([236, 140, 130], .6); g.beginPath(); g.arc(hc[0] - 9, hc[1] + 6, 4, 0, TAU); g.fill();
  if (happy > .5) ink(g, ellipsePts(hc[0] - 8, hc[1] + 1, 3.2, 2.4, 10, Math.PI * 1.1, Math.PI * 1.9), { w: 1.6, taper: false });
  else { g.fillStyle = rgb(INK); g.beginPath(); g.arc(hc[0] - 8, hc[1], 2, 0, TAU); g.fill(); }
  ink(g, ellipsePts(hc[0] - 10, hc[1] + 8, 3, 2 + happy * 1.5, 10, Math.PI * .15, Math.PI * .85), { w: 1.3, taper: false }); // smile
  // arms: front arm reaches for the boat, back arm holds the lantern
  const sh = [-6, -36];
  let hand;
  if (boatPos.held) hand = [-26, -26];
  else {
    // inverse rotation of the boat position into the torso frame
    const dx = boatPos.x - hip[0], dy = boatPos.y - hip[1], c = Math.cos(.75 * bend), s = Math.sin(.75 * bend);
    const lx = dx * c - dy * s, ly = dx * s + dy * c;
    const idle = [-10, -4], reach = [lx + 26, ly - 4];
    const k = ss(24.6, 25.8, t);
    const tx = lerp(idle[0], reach[0], k), ty = lerp(idle[1], reach[1], k);
    const L = 48, dd = Math.hypot(tx - sh[0], ty - sh[1]);
    hand = dd > L ? [sh[0] + (tx - sh[0]) / dd * L, sh[1] + (ty - sh[1]) / dd * L] : [tx, ty];
  }
  const elbow = [(sh[0] + hand[0]) / 2 + 4, (sh[1] + hand[1]) / 2 + 6];
  ink(g, wobble([sh, elbow, hand], 3, .5, seed + 8), { w: 4.4, col: [230, 56, 56], seed, taper: false });
  g.fillStyle = rgb([244, 214, 188]); g.beginPath(); g.arc(hand[0], hand[1], 3.6, 0, TAU); g.fill();
  const sh2 = [8, -36], h2 = [16, -6 + Math.sin(t * 2) * 1.2];
  ink(g, wobble([sh2, [14, -20], h2], 3, .5, seed + 9), { w: 4.4, col: [230, 56, 56], seed, taper: false });
  g.restore();
  // lantern hangs from the back hand (world space so it stays upright)
  const c = Math.cos(-.75 * bend), s = Math.sin(-.75 * bend);
  const hw = [hip[0] + h2[0] * c - h2[1] * s, hip[1] + h2[0] * s + h2[1] * c];
  const sw = Math.sin(t * 1.7) * .12;
  const lx = hw[0] + Math.sin(sw) * 20, ly = hw[1] + Math.cos(sw) * 20;
  ink(g, [[hw[0], hw[1]], [lx, ly - 9]], { w: 1.2, taper: false });
  g.fillStyle = rgb([255, 200, 110]); g.beginPath(); g.ellipse(lx, ly, 8, 10, 0, 0, TAU); g.fill();
  ink(g, wobble(ellipsePts(lx, ly, 8, 10, 20), 3, .4, seed + 10), { w: 1.4, seed, taper: false });
  g.fillStyle = rgb([120, 50, 40]); g.fillRect(lx - 5, ly - 12, 10, 3); g.fillRect(lx - 5, ly + 9, 10, 3);
  return { lantern: [lx, ly], handWorld: (() => { const hh = [-26, -26]; return [hip[0] + hh[0] * c - hh[1] * s, hip[1] + hh[0] * s + hh[1] * c]; })() };
}

function glow(x, y, r, col, a) {
  if (a <= 0) return;
  const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgb(col, a)); gr.addColorStop(.35, rgb(col, a * .45)); gr.addColorStop(1, rgb(col, 0));
  ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function waveRow(t, wy, scale, a, n, seedRow, maxX = Infinity) {
  // little ink "︶" marks scattered along a row of the sea, drifting slowly
  const zl = cam.z, left = cam.x - W / 2 / zl - 80, right = cam.x + W / 2 / zl + 80, tile = 110 * scale;
  const drift = t * 14 * scale;
  for (let k = Math.floor((left + drift) / tile); k <= Math.ceil((right + drift) / tile); k++) {
    const h = hash(k * 13.1 + seedRow);
    if (h > .62) continue;
    if (k * tile - drift > maxX - 40 * scale) continue;
    const x = k * tile - drift + hash(k + seedRow * 3) * tile * .6, y = wy + Math.sin(t * 1.3 + k) * 2 * scale * (1 + n);
    const w = (14 + h * 18) * scale * (1 + n * .4), amp = (3 + n * 3) * scale;
    const pts = []; for (let i = 0; i <= 12; i++) { const u = i / 12; pts.push([x + u * w * 2, y + Math.sin(u * TAU * 2 + Math.PI) * amp * .5 - Math.abs(Math.sin(u * TAU)) * amp * .3]); }
    ink(ctx, pts, { w: 1.3 * scale + .3, a, col: mix([255, 255, 255], [200, 210, 255], n), seed: k, taper: true });
  }
}

function subtitle(t, t0, t1, en, zh) {
  const a = ss(t0, t0 + .45, t) * (1 - ss(t1 - .45, t1, t));
  if (a <= 0) return;
  screen();
  const n = night(t), dark = n > .45;
  const fg = dark ? [246, 240, 226] : [42, 36, 32], halo = dark ? [30, 20, 90] : [255, 250, 240];
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  const lines = [[en, '600 29px Georgia, "Bitstream Charter", "DejaVu Serif", serif', H - 72], [zh, '25px "PingFang SC", "Noto Sans SC", "WenQuanYi Zen Hei", sans-serif', H - 36]];
  for (const [txt, font, y] of lines) {
    ctx.font = font; ctx.lineWidth = 6; ctx.strokeStyle = rgb(halo, a * .55); ctx.strokeText(txt, W / 2, y);
    ctx.fillStyle = rgb(fg, a); ctx.fillText(txt, W / 2, y);
  }
}

function seal(x, y, s, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-.04);
  ctx.fillStyle = rgb([196, 52, 40], .9 * a);
  ctx.beginPath(); ctx.roundRect(-s / 2, -s / 2, s, s, 5); ctx.fill();
  ctx.strokeStyle = rgb([250, 240, 228], a); ctx.lineWidth = 2; ctx.strokeRect(-s / 2 + 5, -s / 2 + 5, s - 10, s - 10);
  ctx.fillStyle = rgb([250, 240, 228], a); ctx.font = `${s * .36}px "WenQuanYi Zen Hei", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('纸', 0, -s * .18); ctx.fillText('船', 0, s * .2);
  ctx.restore();
}

// ------------------------------------------------------------------ frame
function renderAt(t) {
  t = clamp(t, 0, DURATION);
  cam = camera(t);
  hy = (HORIZON - cam.y) * cam.z + H / 2;
  const n = night(t);
  screen();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rgb(PAPER); ctx.fillRect(0, 0, W, H);

  // ---- sky (washes in from the left)
  const pSky = ss(1.6, 3.6, t);
  if (pSky > 0) {
    ctx.save(); revealClip(pSky, -20, hy + 4);
    const sx = -110 - (cam.x - 640) * .02;
    ctx.fillStyle = rgb(mix([64, 168, 246], [44, 36, 150], n)); ctx.fillRect(0, 0, W, hy);
    ctx.drawImage(SKY[0], sx, hy - 820);
    if (n > 0) { ctx.globalAlpha = n; ctx.drawImage(SKY[1], sx, hy - 820); ctx.globalAlpha = 1; }
    // stars
    const sa = ss(12.2, 15.2, t);
    if (sa > 0) {
      const r = rng(77);
      for (let i = 0; i < 110; i++) {
        const x = ((r() * 1700 - (cam.x - 640) * .04) % 1500 + 1500) % 1500 - 100, y = hy - 40 - r() * 520;
        const tw = .55 + .45 * Math.sin(t * (1.5 + r() * 2) + i);
        const big = r() < .18;
        if (big) drawStar4(ctx, x, y, 5 + r() * 3, [255, 246, 214], sa * tw);
        else { ctx.fillStyle = rgb([250, 244, 226], sa * tw * .8); ctx.fillRect(x, y, 1.6, 1.6); }
      }
    }
    // moon
    const ma = ss(12.8, 15, t);
    if (ma > 0) {
      const mx = 1040 - (cam.x - 640) * .03, my = hy - 300 * Math.min(1, cam.z);
      glow(mx, my, 130, [255, 240, 200], .3 * ma);
      ctx.save(); ctx.beginPath(); ctx.arc(mx, my, 30, 0, TAU); ctx.clip();   // crescent = moon minus an offset disc
      ctx.fillStyle = rgb([255, 236, 150], ma); ctx.beginPath(); ctx.arc(mx, my, 30, 0, TAU); ctx.arc(mx + 13, my - 8, 27, 0, TAU); ctx.fill('evenodd'); ctx.restore();
      ctx.strokeStyle = rgb(INK, .5 * ma); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(mx, my, 30, Math.PI * .1, Math.PI * 1.45); ctx.stroke();
    }
    // sun sets behind the horizon
    const sunA = ss(2.6, 3.8, t) * (1 - ss(13, 14.2, t));
    if (sunA > 0) {
      const sxp = 930 - (cam.x - 640) * .05, syp = hy - lerp(210, -34, ss(3.5, 13.6, t)) * Math.min(1.1, cam.z);
      const sr = 46 * (.6 + .4 * ss(2.6, 3.8, t));
      glow(sxp, syp, 260, [255, 200, 90], .55 * sunA);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, hy); ctx.clip();
      const rr = rng(5); ctx.globalAlpha = sunA; wash(ctx, sxp, syp, sr, sr, [255, 110, 50], rr, { layers: 6, alpha: .34, jit: .06 }); ctx.globalAlpha = 1;
      ctx.restore();
    }
    // clouds (parallax .12)
    layer(.12);
    CLOUDS.forEach(([x, y], i) => {
      const cx = x + t * 6, cy = HORIZON - 340 + y * .9;
      ctx.globalAlpha = 1 - n; ctx.drawImage(CLD[0][i], cx, cy);
      ctx.globalAlpha = n; ctx.drawImage(CLD[1][i], cx, cy);
    });
    ctx.globalAlpha = 1; screen();
    ctx.restore();
  }

  // ---- far islands (parallax .35)
  const pIsl = ss(2.8, 4.4, t);
  if (pIsl > 0) {
    const zl = layer(.35);
    ISLANDS.forEach(([x, w, h], i) => {
      const spr = ISL[0][i];
      ctx.globalAlpha = pIsl * (1 - n); ctx.drawImage(spr, x - 30, HORIZON - spr.height + 8);
      ctx.globalAlpha = pIsl * n; ctx.drawImage(ISL[1][i], x - 30, HORIZON - spr.height + 8);
    });
    ctx.globalAlpha = 1; screen();
  }

  // ---- sea
  const pSea = ss(2.2, 4.0, t);
  if (pSea > 0) {
    ctx.save(); revealClip(pSea, hy - 2, H + 20);
    const sx = -110;
    ctx.drawImage(SEA[0], sx, hy - 2, 1500, 820 * Math.max(1, cam.z * .9));
    if (n > 0) { ctx.globalAlpha = n; ctx.drawImage(SEA[1], sx, hy - 2, 1500, 820 * Math.max(1, cam.z * .9)); ctx.globalAlpha = 1; }
    // sun / moon reflection streaks
    const refl = (1 - ss(12.5, 14, t)) * ss(3, 4.5, t);
    const mrefl = ss(13.5, 16, t) * (1 - ss(17, 19, t)) * .6;
    for (const [rx, a, col] of [[930 - (cam.x - 640) * .05, refl, [255, 200, 130]], [1040 - (cam.x - 640) * .03, mrefl, [220, 228, 255]]]) {
      if (a <= 0) continue;
      for (let i = 0; i < 9; i++) {
        const y = hy + 8 + i * i * 4.2 * cam.z, w = 70 - i * 4 + Math.sin(t * 2 + i) * 10;
        ctx.strokeStyle = rgb(col, a * (.8 - i * .07)); ctx.lineWidth = 2.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(rx - w / 2 + Math.sin(t * 1.5 + i * 2) * 8, y); ctx.lineTo(rx + w / 2 + Math.sin(t * 1.5 + i * 2) * 8, y); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---- horizon ink line draws itself first
  const pHor = ss(1.0, 2.6, t);
  if (pHor > 0) {
    const pts = []; for (let x = -20; x <= W + 20; x += 8) pts.push([x, hy + Math.sin(x * .013) * 1.2]);
    ink(ctx, pts, { w: 1.9, p: pHor, seed: 3, a: lerp(.85, .6, n), taper: false });
  }

  // ---- gulls (parallax .6), day only
  const gA = ss(7, 8, t) * (1 - ss(11, 12, t));
  if (gA > 0) {
    layer(.6);
    for (let i = 0; i < 3; i++) {
      const x = 900 + i * 70 + (t - 7) * 46 + Math.sin(i * 4) * 30, y = HORIZON - 200 - i * 24 + Math.sin(t * 1.2 + i) * 8;
      const f = Math.sin(t * 7 + i * 2) * 6;
      ink(ctx, wobble([[x - 14, y - f], [x - 6, y - 2], [x, y + 2], [x + 6, y - 2], [x + 14, y - f]], 3, .3, i), { w: 1.6, a: gA, taper: false });
    }
    screen();
  }

  // ---- mid layer (world): shore, waves, stars, boat, child
  layer(1);
  const shoreVis = cam.x + W / 2 / cam.z > SHORE_X0;
  waveRow(t, 408, .45, .35 * pSea, n, 1);
  waveRow(t, 425, .6, .45 * pSea, n, 2);
  waveRow(t, 446, .8, .5 * pSea, n, 3);
  if (shoreVis) ctx.drawImage(SHORE, SHORE_X0, SHORE_Y0);
  const winA = ss(19.6, 21, t);

  // falling stars → gold blooms on the water
  const blooms = [];
  FALL.forEach((s, i) => {
    const fallStart = s.ti - .75;
    if (t < fallStart) {
      // waiting in the sky, twinkling, a little bigger than the others
      const a = ss(13.5, 15.5, t) * (.7 + .3 * Math.sin(t * 3 + i));
      if (a > 0) { glow(s.x0, s.y0, 26, [255, 230, 160], .4 * a); drawStar4(ctx, s.x0, s.y0, 9, [255, 236, 180], a); }
    } else if (t < s.ti) {
      const u = easeIn((t - fallStart) / .75);
      const x = lerp(s.x0, s.x, u), y = lerp(s.y0, WATER + 4, u);
      const px = lerp(s.x0, s.x, Math.max(0, u - .25)), py = lerp(s.y0, WATER + 4, Math.max(0, u - .25));
      const gr = ctx.createLinearGradient(px, py, x, y); gr.addColorStop(0, 'rgba(255,220,140,0)'); gr.addColorStop(1, 'rgba(255,230,160,.9)');
      ctx.strokeStyle = gr; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
      glow(x, y, 30, [255, 226, 150], .6); drawStar4(ctx, x, y, 10, [255, 240, 190], 1);
    } else {
      const age = t - s.ti, k = easeOut(clamp(age / .9));
      blooms.push([s.x, k, age]);
      ctx.save(); ctx.globalAlpha = .9 * k; const sc = .55 + .45 * k;
      ctx.drawImage(BLOOM, s.x - 110 * sc, WATER + 6 - 35 * sc, 220 * sc, 70 * sc); ctx.restore();
      if (age < .8) { // splash ring
        ctx.strokeStyle = rgb([255, 236, 180], .8 * (1 - age / .8)); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(s.x, WATER + 6, 20 + age * 120, 5 + age * 22, 0, 0, TAU); ctx.stroke();
      }
    }
  });

  // the paper: falls as a sheet, folds itself into a boat, lands, sails
  let boat = { x: 0, y: 0, held: false };
  if (t >= 3.8) {
    const m = ss(5.0, 6.0, t);
    let x, y, rot;
    if (t < 6.3) {
      const u = (t - 3.8) / 2.5;
      x = BX0 - 60 * (1 - u) + Math.sin(u * 9) * 40 * (1 - u);
      y = lerp(70, WATER - 8, easeIO(u) * .3 + u * .7);
      rot = Math.sin(u * 8) * .5 * (1 - m);
    } else {
      x = bx(t);
      const sea = 1 + n * 1.4;
      y = WATER - 8 + Math.sin(t * 2.1) * 2.4 * sea;
      rot = Math.sin(t * 1.6) * .05 * sea;
    }
    const lift = ss(26.4, 27.4, t);
    if (lift > 0) {
      const ch = drawChildPreview(t);
      x = lerp(x, ch[0], easeIO(lift)); y = lerp(y, ch[1], easeIO(lift)); rot *= 1 - lift;
      boat.held = lift >= 1;
    }
    const onPath = blooms.reduce((a, [bxp, k]) => Math.max(a, k * (1 - clamp(Math.abs(bxp - x) / 140))), 0);
    const g0 = Math.max(onPath, ss(17.5, 19, t) * .35);
    if (g0 > 0) glow(x, y - 6, 80, [255, 214, 130], .35 * g0);
    drawBoat(ctx, x, y, rot, m, t, g0, (1 - m) * (t < 6.3 ? 1 : 0));
    boat.x = x; boat.y = y;
    // landing splash
    if (t > 6.3 && t < 7.8) {
      const age = t - 6.3;
      for (let k = 0; k < 2; k++) { const a2 = age - k * .25; if (a2 <= 0) continue;
        ctx.strokeStyle = rgb([250, 250, 255], .7 * (1 - a2 / 1.25)); ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.ellipse(BX0, WATER + 6, 30 + a2 * 90, 5 + a2 * 12, 0, 0, TAU); ctx.stroke(); }
    }
  }

  let child = null;
  if (shoreVis) child = drawChild(t, boat);

  waveRow(t, 492, 1.0, .55 * pSea, n, 4, shoreEdgeX(492));
  waveRow(t, 540, 1.2, .55 * pSea, n, 5, shoreEdgeX(540));
  waveRow(t, 600, 1.4, .5 * pSea, n, 6, shoreEdgeX(600));
  waveRow(t, 680, 1.7, .45 * pSea, n, 7, shoreEdgeX(680));

  // ---- light: warm lights belong to the people waiting
  ctx.globalCompositeOperation = 'lighter';
  if (shoreVis && winA > 0) {
    const [wx, wy] = WIN;
    ctx.fillStyle = rgb([255, 190, 90], winA * .9); ctx.fillRect(wx - 10, wy - 9, 20, 18);
    glow(wx, wy, 90, [255, 170, 80], .45 * winA);
  }
  if (child) glow(child.lantern[0], child.lantern[1], 120 + Math.sin(t * 5) * 4, [255, 176, 90], .5 * ss(19, 21, t) + .1);
  blooms.forEach(([x, k, age], i) => {
    glow(x, WATER + 6, 60, [255, 210, 90], .5 * k * (.85 + .15 * Math.sin(age * 4)));
    for (let j = 0; j < 3; j++) { const ph = age * 2.2 + j * 2.1 + i; const tw = Math.max(0, Math.sin(ph)); drawStar4(ctx, x + (hash(i * 7 + j) - .5) * 90, WATER - 4 - hash(i * 3 + j) * 16, 4 + 3 * tw, [255, 236, 180], .8 * k * tw); }
  });
  ctx.globalCompositeOperation = 'source-over';
  screen();

  // ---- vignette + finale glow
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  vg.addColorStop(0, 'rgba(30,10,60,0)'); vg.addColorStop(1, `rgba(30,10,60,${.06 + .22 * n})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const fin = ss(27.0, 28.0, t);
  if (fin > 0) { ctx.globalCompositeOperation = 'lighter'; glow(W / 2 - 20, H / 2 - 10, 520, [255, 190, 110], .28 * fin); ctx.globalCompositeOperation = 'source-over'; }

  // ---- paper grain over everything painted
  ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = .4; ctx.drawImage(GRAIN, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // ---- title on blank paper
  const ta = ss(.2, 1.0, t) * (1 - ss(3.0, 3.7, t));
  if (ta > 0) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const title = 'The Little Paper Boat';
    ctx.font = 'italic 600 54px Georgia, "Bitstream Charter", "DejaVu Serif", serif';
    const tw = ctx.measureText(title).width; let xx = W / 2 - tw / 2; ctx.textAlign = 'left';
    [...title].forEach((ch, i) => { const a = ss(.2 + i * .04, .7 + i * .04, t) * ta; ctx.fillStyle = rgb(INK, a); ctx.fillText(ch, xx, 250 - (1 - a) * 6); xx += ctx.measureText(ch).width; });
    ctx.textAlign = 'center';
    ctx.font = '34px "PingFang SC", "Noto Sans SC", "WenQuanYi Zen Hei", sans-serif'; ctx.fillStyle = rgb(INK, ss(.9, 1.6, t) * ta); ctx.fillText('小 纸 船', W / 2, 304);
    seal(W / 2 + 120, 296, 34, ss(1.4, 1.8, t) * ta);
  }

  // ---- subtitles (English above, Chinese below)
  subtitle(t, 4.0, 8.6, 'A sheet of paper wanted to see the sea.', '一张纸，想去看看大海。');
  subtitle(t, 9.0, 13.0, 'It sailed until the sun fell asleep.', '它一直漂，漂到太阳都睡着了。');
  subtitle(t, 13.4, 17.2, 'Then the sea grew dark. Which way was home?', '海变黑了。家，在哪儿呢？');
  subtitle(t, 17.6, 22.4, 'So the stars came down to light the way.', '于是，星星落下来，为它照亮了路。');
  subtitle(t, 22.8, 27.4, 'Someone had been waiting all along.', '原来，一直有人在等它。');

  // ---- end card: a wet-brush wipe of fresh paper, then the title and seal
  const pe = ss(27.6, 28.6, t);
  if (pe > 0) {
    ctx.save(); ctx.beginPath();
    const r = rng(99);
    for (let i = 0; i < 70; i++) {
      const x = r() * (W + 200) - 100, y = r() * (H + 100) - 50, d = (x / W) * .5 + r() * .3;
      const k = clamp((pe - d * .8) / .45); if (k <= 0) continue;
      ctx.moveTo(x + 180 * k, y); ctx.ellipse(x, y, 190 * k, 150 * k, r() * 3, 0, TAU);
    }
    ctx.clip();
    ctx.fillStyle = rgb(PAPER); ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = .6; ctx.drawImage(GRAIN, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const ea = ss(28.4, 29.0, t);
    const rr = rng(12); ctx.globalAlpha = ea; wash(ctx, W / 2, 300, 150, 26, [40, 190, 230], rr, { layers: 5, alpha: .22 }); ctx.globalAlpha = 1;
    drawBoat(ctx, W / 2, 284 + Math.sin(t * 2) * 2, Math.sin(t * 1.6) * .04, 1, t, ss(28.4, 29.6, t) * .6);
    ctx.textAlign = 'center';
    ctx.font = 'italic 600 46px Georgia, "Bitstream Charter", "DejaVu Serif", serif'; ctx.fillStyle = rgb(INK, ea); ctx.fillText('The Little Paper Boat', W / 2, 400);
    ctx.font = '30px "PingFang SC", "Noto Sans SC", "WenQuanYi Zen Hei", sans-serif'; ctx.fillStyle = rgb(INK, ss(28.6, 29.2, t)); ctx.fillText('小 纸 船', W / 2, 450);
    seal(W / 2 + 104, 444, 32, ss(29.0, 29.3, t));
    ctx.restore();
  }
}
// where the child's front hand will be once the boat is lifted (computed without drawing)
function drawChildPreview(t) { return [CX - 40, WATER - 66]; }

window.renderAt = renderAt;
window.DURATION = DURATION;

// --------------------------------------------------------------- playback
if (location.hash === '#capture') document.body.classList.add('capture');
const music = document.getElementById('music');
let playing = false, t0 = 0, paused = 0;
const now = () => performance.now() / 1000;
function clockT() { return playing ? (music.readyState >= 2 && !music.paused ? music.currentTime : now() - t0) : paused; }
function loop() { const t = clockT(); renderAt(t); if (playing && t >= DURATION) { playing = false; paused = DURATION; document.getElementById('play').textContent = '▶ Play · 播放'; } if (playing) requestAnimationFrame(loop); }
document.getElementById('play').onclick = () => {
  if (playing) { playing = false; paused = clockT(); music.pause(); document.getElementById('play').textContent = '▶ Play · 播放'; return; }
  if (paused >= DURATION) paused = 0;
  playing = true; t0 = now() - paused; music.currentTime = paused; music.play().catch(() => {});
  document.getElementById('play').textContent = '❚❚ Pause · 暂停'; requestAnimationFrame(loop);
};
document.getElementById('replay').onclick = () => { playing = false; music.pause(); paused = 0; document.getElementById('play').click(); };
renderAt(location.hash === '#capture' ? 0 : 4.6);
</script>
